[project]
name = "gnn-physics-benchmark"
version = "0.1.0"
description = "A benchmark for comparing autoregressive GNN simulators on MD compression trajectories"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.14.0",
    "torch-geometric>=2.8.0.post1",
]

[project.optional-dependencies]
# Only the notebooks and ad-hoc plotting need these. The benchmark itself, and
# in particular `gnn_physics_benchmark.interfaces`, must import without them.
analysis = [
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
]

[project.scripts]
gnn-bench = "gnn_physics_benchmark.cli:main"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gnn_physics_benchmark"]
