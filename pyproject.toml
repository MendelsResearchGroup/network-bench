[project]
name = "network-bench"
version = "0.1.0"
description = "A benchmark for comparing autoregressive GNN simulators on MD compression trajectories"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.14.0",
    "torch-geometric>=2.8.0.post1",
]

[project.optional-dependencies]
# Only ad-hoc plotting needs these. The benchmark itself, and
# in particular `network_bench.interfaces`, must import without them.
analysis = [
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/network_bench"]
