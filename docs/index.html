<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="website-version" content="__WEBSITE_REVISION__">
<meta name="description" content="Compare learned simulators on spring-network compression. Explore rollout accuracy, learning curves, model parameters and exact benchmark splits.">
<title>Network Bench — Results</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="studio.css">
<script src="https://cdn.plot.ly/plotly-4.1.1.min.js" defer>
</script>
<script src="app.js" defer>
</script>
</head>
<body class="design studio" data-default-view="rollouts" data-click-inspection="true" >
<header class="design-header">
<a class="identity" href="./"><svg width="29" height="29" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 25L16 5L27 25Z"/><circle cx="5" cy="25" r="3"/><circle cx="16" cy="5" r="3"/><circle cx="27" cy="25" r="3"/></svg><span class="identity-name">network<span>bench</span></span>
</a>
<div class="downloads">
<button id="download">CSV ↓</button>
<a id="json-download" href="results.json" download>JSON ↓</a>
<button id="theme" title="Change theme">◐</button>
</div>
</header>
<main class="design-main">
<div id="notice" class="notice">Loading benchmark results…</div>
<div id="dashboard" hidden>
<div class="studio-layout">
<aside id="explore" class="instrument">
<div class="control-block dataset-control">
<label class="control-label" for="datasets">Dataset</label>
<select id="datasets"></select>
<label id="cohort-label" hidden>Comparison <select id="cohort">
</select>
</label>
</div>
<div class="instrument-pair">
<div class="control-block">
<span class="control-label">Distribution</span>
<div id="modes" class="segmented">
<button data-mode="normal" aria-pressed="true">Normal</button>
<button data-mode="ood" aria-pressed="false">OOD</button>
</div>
</div>
<div class="control-block">
<span class="control-label">Training</span>
<div id="training-modes" class="segmented">
<button data-training="one_step" aria-pressed="true">One-step</button>
<button data-training="multi_step" aria-pressed="false">MST</button>
</div>
</div>
</div>
<div class="control-block">
<span class="control-label">X-axis</span>
<div id="studies" class="segmented">
<button data-study="rollouts" aria-pressed="true">Rollout step</button>
<button data-study="learning" aria-pressed="false">Training networks</button>
</div>
</div>
<div class="horizon-control">
<div class="horizon-label">
<label for="horizon">Score at step</label>
<output id="horizon-value">
</output>
</div>
<input id="horizon" type="range" min="0" max="9" value="9">
<div class="range-labels">
<span id="first-step">
</span>
<span id="last-step">
</span>
</div>
</div>
<div class="models">
<div class="models-heading">
<span class="control-label">Models</span>
<div>
<button id="top-models" class="text-button">Top 4</button>
<button id="reset-models" class="text-button">All</button>
</div>
</div>
<div id="legend" class="legend">
</div>
</div>
<details class="options">
<summary>Options</summary>
<div class="option-fields">
<label>
<span id="plot-seed-label">Split &amp; training seed</span>
<select id="plot-seed">
<option value="all">All seeds</option>
</select>
</label>
<label>Lines<select id="line-mode">
<option value="mean">Mean across seeds</option>
<option value="individual">Individual seeds</option>
</select>
</label>
<label>
<input id="bands" type="checkbox" checked> ±1 sample SD</label>
<label id="train-size-label" hidden>Inspect training size<select id="train-size">
</select>
</label>
<p id="legend-note" class="footnote">
</p>
</div>
</details>
</aside>
<div class="workspace">
<div class="selection-summary">
<span id="selection-note">
</span>
<span id="split-counts">
</span>
</div>
<section class="metric-panel r2-panel">
<div class="metric-heading">
<h2>Poisson’s ratio R²</h2>
<span>Higher is better</span>
</div>
<div id="chart" class="chart">
<div id="plot" class="plot">
</div>
</div>
<p id="range-note" class="footnote">
</p>
</section>
<section class="metric-panel mse-panel">
<div class="metric-heading">
<h2>Position MSE</h2>
<span>Lower is better</span>
</div>
<div id="mse-chart" class="chart">
<div id="mse-plot" class="plot">
</div>
</div>
<p id="mse-range-note" class="footnote">
</p>
</section>
<section class="snapshot">
<div class="snapshot-heading">
<h2>Model scores</h2>
<p id="ranking-note" class="footnote">
</p>
</div>
<ol id="ranking" class="ranking">
</ol>
</section>
<details class="methods">
<summary>Exact split &amp; training protocol</summary>
<p id="split-rule" class="footnote">
</p>
<p id="protocol" class="footnote">
</p>
<label id="split-seed-label" hidden>Inspect split<select id="split-seed">
<option value="0">Seed 0</option>
<option value="1">Seed 1</option>
<option value="2">Seed 2</option>
</select>
</label>
<p id="split-note" class="footnote">
</p>
<a id="ranking-audit" hidden>Full Poisson’s ratio ranking ↗</a>
<div id="split-membership" class="split-membership">
</div>
</details>
</div>
</div>
</div>
</main>
<footer class="design-footer">
<span id="generated">
</span>
<a href="https://github.com/MendelsResearchGroup/network-bench">Source ↗</a>
</footer>
<noscript><p class="design-main notice">This explorer needs JavaScript. You can still <a href="results.json">download the results JSON</a>.</p></noscript>
</body>
</html>
